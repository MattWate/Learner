<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LearnerGenie · Learner Hub</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(to bottom, rgb(238 242 255), #f8fafc);
            min-height: 100vh;
        }
    </style>
</head>
<body>
    <div id="app-root" class="min-h-screen">
        <div class="min-h-screen flex items-center justify-center">
            <div class="animate-spin rounded-full h-14 w-14 border-b-2 border-indigo-600"></div>
        </div>
    </div>

    <script src="/shared/learner-auth.js"></script>
    <script>
        (function () {
            const root = document.getElementById('app-root');
            let session = null;
            let account = null;
            let profiles = [];
            let activeProfile = null;

            function iconRefresh() {
                if (window.lucide?.createIcons) window.lucide.createIcons();
            }

            function activityUrl(path) {
                if (!activeProfile) return '/app.html';
                return `${path}?profile_id=${encodeURIComponent(activeProfile.id)}`;
            }

            function studySquadsUrl() {
                return activityUrl('/study-squads.html');
            }

            function dashboardTemplate() {
                return `
                    <div class="min-h-screen">
                        <header class="bg-white/90 backdrop-blur border-b border-indigo-100 sticky top-0 z-20">
                            <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between gap-4">
                                <div class="flex items-center gap-3">
                                    <img src="/logo.svg" alt="LearnerGenie" class="h-11 w-11">
                                    <div>
                                        <p class="text-xs font-semibold uppercase tracking-wider text-indigo-600">LearnerGenie</p>
                                        <p class="font-bold text-gray-900">${activeProfile.name}'s learning hub</p>
                                    </div>
                                </div>
                                <div class="flex items-center gap-2">
                                    <button id="switch-profile-btn" class="px-3 py-2 rounded-lg text-sm font-semibold text-indigo-700 bg-indigo-50 hover:bg-indigo-100">Switch learner</button>
                                    <button id="sign-out-btn" class="p-2 rounded-lg text-gray-500 hover:bg-gray-100" aria-label="Sign out"><i data-lucide="log-out" class="h-5 w-5"></i></button>
                                </div>
                            </div>
                        </header>

                        <main class="max-w-6xl mx-auto px-4 py-8 md:py-12">
                            <section class="bg-white p-7 md:p-10 rounded-2xl shadow-xl border-t-4 border-indigo-500 text-center">
                                <i data-lucide="sparkles" class="mx-auto h-14 w-14 text-amber-400"></i>
                                <h1 class="mt-4 text-3xl md:text-5xl font-bold text-gray-900">Hi, ${activeProfile.name}!</h1>
                                <p class="mt-3 text-gray-600 max-w-2xl mx-auto">Choose what you want to work on. Each tool now opens in its own focused workspace.</p>
                            </section>

                            <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
                                ${activityCard({
                                    href: activityUrl('/activities/homework-help.html'),
                                    icon: 'life-buoy',
                                    title: 'Homework Helper',
                                    description: 'Type a question or upload a worksheet photo and work through it step by step.',
                                    accent: 'rose'
                                })}
                                ${activityCard({
                                    href: activityUrl('/activities/explain-simply.html'),
                                    icon: 'lightbulb',
                                    title: 'Explain It Simply',
                                    description: 'Turn a difficult idea into an explanation that is easier to understand.',
                                    accent: 'violet'
                                })}
                                ${activityCard({
                                    href: activityUrl('/activities/learning-hub.html'),
                                    icon: 'book-open-check',
                                    title: 'Revision Notes',
                                    description: 'Create clear study notes from a topic, text or uploaded learning material.',
                                    accent: 'indigo'
                                })}
                                ${activityCard({
                                    href: activityUrl('/activities/test-builder.html'),
                                    icon: 'clipboard-check',
                                    title: 'Practice Test',
                                    description: 'Build a practice test and check your understanding before the real thing.',
                                    accent: 'emerald'
                                })}
                                ${activityCard({
                                    href: activityUrl('/activities/math-hub.html'),
                                    icon: 'calculator',
                                    title: 'Mathematics',
                                    description: 'Get guided help with a maths problem and understand the working.',
                                    accent: 'amber'
                                })}
                                ${activityCard({
                                    href: studySquadsUrl(),
                                    icon: 'users-round',
                                    title: 'Study Squads',
                                    description: 'Build consistency with private groups, streaks and shared study goals.',
                                    accent: 'fuchsia'
                                })}
                            </section>

                            <section class="mt-8 bg-white rounded-2xl border border-gray-200 p-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                                <div>
                                    <p class="font-bold text-gray-900">Account</p>
                                    <p class="text-sm text-gray-500">Current plan: ${formatTier(account?.active_tier)}</p>
                                </div>
                                <button id="add-profile-btn" class="px-4 py-2.5 rounded-lg font-semibold bg-gray-900 text-white hover:bg-gray-800">Add learner profile</button>
                            </section>
                        </main>
                    </div>
                `;
            }

            function activityCard({ href, icon, title, description, accent }) {
                const styles = {
                    rose: ['border-rose-400', 'text-rose-600', 'bg-rose-50'],
                    violet: ['border-violet-500', 'text-violet-600', 'bg-violet-50'],
                    indigo: ['border-indigo-500', 'text-indigo-600', 'bg-indigo-50'],
                    emerald: ['border-emerald-500', 'text-emerald-600', 'bg-emerald-50'],
                    amber: ['border-amber-400', 'text-amber-600', 'bg-amber-50'],
                    fuchsia: ['border-fuchsia-500', 'text-fuchsia-600', 'bg-fuchsia-50']
                }[accent];

                return `
                    <a href="${href}" class="group bg-white p-6 rounded-2xl shadow-lg border-t-4 ${styles[0]} hover:-translate-y-1 hover:shadow-xl transition flex flex-col min-h-64">
                        <div class="h-12 w-12 rounded-xl ${styles[2]} flex items-center justify-center">
                            <i data-lucide="${icon}" class="h-6 w-6 ${styles[1]}"></i>
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 mt-5">${title}</h2>
                        <p class="text-gray-600 mt-2 leading-relaxed">${description}</p>
                        <span class="mt-auto pt-6 inline-flex items-center font-semibold ${styles[1]}">Open tool <i data-lucide="arrow-right" class="h-4 w-4 ml-2 transition group-hover:translate-x-1"></i></span>
                    </a>
                `;
            }

            function profilePickerTemplate() {
                const cards = profiles.map(profile => `
                    <button data-profile-id="${profile.id}" class="profile-btn group p-5 rounded-2xl border border-gray-200 bg-white hover:border-indigo-300 hover:shadow-lg transition text-center">
                        <div class="h-20 w-20 mx-auto rounded-full bg-indigo-100 flex items-center justify-center">
                            <i data-lucide="user" class="h-9 w-9 text-indigo-600"></i>
                        </div>
                        <span class="block mt-3 font-bold text-gray-900">${escapeHtml(profile.name)}</span>
                    </button>
                `).join('');

                return `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="w-full max-w-3xl bg-white rounded-2xl shadow-2xl p-7 md:p-10">
                            <div class="text-center">
                                <img src="/logo.svg" alt="LearnerGenie" class="h-20 w-20 mx-auto">
                                <h1 class="text-3xl font-bold text-gray-900 mt-4">Who's learning today?</h1>
                                <p class="text-gray-500 mt-2">Choose a learner profile to open their dashboard.</p>
                            </div>
                            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-8">
                                ${cards}
                                <button id="picker-add-profile-btn" class="p-5 rounded-2xl border-2 border-dashed border-gray-300 hover:border-indigo-400 hover:bg-indigo-50 transition text-center">
                                    <div class="h-20 w-20 mx-auto rounded-full bg-gray-100 flex items-center justify-center">
                                        <i data-lucide="plus" class="h-9 w-9 text-gray-600"></i>
                                    </div>
                                    <span class="block mt-3 font-bold text-gray-700">Add learner</span>
                                </button>
                            </div>
                            <button id="picker-sign-out-btn" class="mt-8 mx-auto flex items-center text-sm text-gray-500 hover:text-gray-800"><i data-lucide="log-out" class="h-4 w-4 mr-2"></i>Sign out</button>
                        </div>
                    </div>
                `;
            }

            function errorTemplate(message) {
                return `
                    <div class="min-h-screen flex items-center justify-center p-4">
                        <div class="max-w-md bg-white rounded-2xl shadow-xl p-8 text-center">
                            <i data-lucide="triangle-alert" class="h-12 w-12 text-red-500 mx-auto"></i>
                            <h1 class="text-2xl font-bold text-gray-900 mt-4">We couldn't open the dashboard</h1>
                            <p class="text-gray-600 mt-2">${escapeHtml(message)}</p>
                            <button id="retry-btn" class="mt-6 px-4 py-2.5 rounded-lg bg-indigo-600 text-white font-semibold">Try again</button>
                        </div>
                    </div>
                `;
            }

            function formatTier(tier) {
                if (!tier || tier === 'free') return 'Free';
                return tier.replace(/^paid_/, '').replace(/_/g, ' ').replace(/\b\w/g, char => char.toUpperCase());
            }

            function escapeHtml(value) {
                return String(value ?? '')
                    .replaceAll('&', '&amp;')
                    .replaceAll('<', '&lt;')
                    .replaceAll('>', '&gt;')
                    .replaceAll('"', '&quot;')
                    .replaceAll("'", '&#039;');
            }

            async function loadProfiles() {
                const { data, error } = await window.LearnerAuth.supabase
                    .from('profiles')
                    .select('*')
                    .eq('account_id', session.user.id);

                if (error) throw new Error(`Could not load learner profiles: ${error.message}`);
                profiles = data || [];
            }

            async function selectProfile(profileId) {
                const profile = profiles.find(item => String(item.id) === String(profileId));
                if (!profile) {
                    window.history.replaceState({}, '', '/app.html');
                    renderProfilePicker();
                    return;
                }

                activeProfile = profile;
                const url = new URL(window.location.href);
                url.searchParams.set('profile_id', profile.id);
                window.history.replaceState({}, '', `${url.pathname}${url.search}`);
                renderDashboard();
            }

            function renderDashboard() {
                root.innerHTML = dashboardTemplate();
                iconRefresh();
                document.getElementById('switch-profile-btn').addEventListener('click', () => {
                    activeProfile = null;
                    window.history.replaceState({}, '', '/app.html');
                    renderProfilePicker();
                });
                document.getElementById('sign-out-btn').addEventListener('click', window.LearnerAuth.signOut);
                document.getElementById('add-profile-btn').addEventListener('click', showAddProfileDialog);
            }

            function renderProfilePicker() {
                root.innerHTML = profilePickerTemplate();
                iconRefresh();
                document.querySelectorAll('.profile-btn').forEach(button => {
                    button.addEventListener('click', () => selectProfile(button.dataset.profileId));
                });
                document.getElementById('picker-add-profile-btn').addEventListener('click', showAddProfileDialog);
                document.getElementById('picker-sign-out-btn').addEventListener('click', window.LearnerAuth.signOut);
            }

            async function showAddProfileDialog() {
                const profileLimit = Number(account?.profile_limit ?? window.LearnerAuth.FREE_PROFILE_LIMIT);
                if (profiles.length >= profileLimit) {
                    alert(`Your current plan allows ${profileLimit} learner profile${profileLimit === 1 ? '' : 's'}.`);
                    return;
                }

                const name = window.prompt('Learner name');
                if (!name || !name.trim()) return;

                const { data, error } = await window.LearnerAuth.supabase
                    .from('profiles')
                    .insert({ account_id: session.user.id, name: name.trim() })
                    .select('*')
                    .single();

                if (error) {
                    alert(`Could not create learner profile: ${error.message}`);
                    return;
                }

                profiles.push(data);
                await selectProfile(data.id);
            }

            async function init() {
                try {
                    session = await window.LearnerAuth.requireSession();
                    if (!session) return;

                    account = await window.LearnerAuth.getAccount(session.user.id);
                    await loadProfiles();

                    const requestedProfileId = window.LearnerAuth.getProfileIdFromUrl();
                    if (requestedProfileId) {
                        await selectProfile(requestedProfileId);
                    } else {
                        renderProfilePicker();
                    }
                } catch (error) {
                    console.error(error);
                    root.innerHTML = errorTemplate(error.message || 'Unknown error');
                    iconRefresh();
                    document.getElementById('retry-btn').addEventListener('click', () => window.location.reload());
                }
            }

            init();
        })();
    </script>
</body>
</html>
