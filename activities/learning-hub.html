<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Genie · Learning Hub</title>
    <link rel="icon" href="/logo.svg" type="image/svg+xml">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="/answer-tools.js"></script>
    <script src="/answer-tools-tts-language-patch.js"></script>

    <style>
        body { font-family: 'Poppins', sans-serif; background: linear-gradient(to bottom, rgb(238 242 255), #f8fafc); min-height: 100vh; }
        .prose { max-width: 65ch; }
        .prose-sm { font-size: 0.875rem; line-height: 1.5; }
        .quiz-question-wrapper.correct { border-left-color: #22c55e; background-color: #f0fdf4; }
        .quiz-question-wrapper.incorrect { border-left-color: #ef4444; background-color: #fef2f2; }
        .quiz-feedback { display: none; font-size: 0.875rem; font-weight: 500; margin-top: 0.75rem; }
        .quiz-question-wrapper.correct .quiz-feedback.correct { display: block; color: #166534; }
        .quiz-question-wrapper.incorrect .quiz-feedback.incorrect { display: block; color: #991b1b; }
    </style>
</head>
<body>
    <div id="page-root" class="min-h-screen flex items-center justify-center p-4">
        <div class="animate-spin rounded-full h-16 w-16 border-b-2 border-indigo-600"></div>
    </div>

    <script src="/shared/learner-auth.js"></script>
    <script src="/shared/learner-api.js"></script>
    <script src="/shared/learner-usage.js"></script>
    <script src="/shared/learner-output.js"></script>
    <script src="/shared/learner-markdown.js"></script>
    <script src="/shared/learner-region.js"></script>
    <script src="/shared/learner-image-upload.js"></script>
    <script src="/shared/learner-quiz.js"></script>
    <script src="/activities/learning-hub.js"></script>
</body>
</html>
